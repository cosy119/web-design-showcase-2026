<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驶向绿色未来——新能源汽车科普</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#f0f7ff;color:#222;line-height:1.6;}
        header{background:linear-gradient(135deg,#2563eb,#0891b2);color:white;text-align:center;padding:40px 20px;}
        h1{font-size:32px;margin-bottom:10px;}
        .subtitle{font-size:17px;opacity:0.9;}
        .container{max-width:1000px;margin:40px auto;padding:0 20px;}
        .card{background:#fff;border-radius:14px;padding:28px;margin-bottom:24px;box-shadow:0 4px 12px #00000010;}
        .card h2{color:#2563eb;margin-bottom:12px;border-left:5px solid #0891b2;padding-left:10px;}
        ul{padding-left:22px;margin-top:8px;}
        li{margin:8px 0;}
        footer{text-align:center;padding:24px;background:#1e293b;color:#fff;margin-top:40px;font-size:14px;}
    </style>
</head>
<body>
    <header>
        <h1>驶向绿色未来</h1>
        <p class="subtitle">新能源汽车科普｜低碳出行，智启新程</p >
    </header>
    <div class="container">
        <div class="card">
            <h2>什么是新能源汽车</h2>
            <p>新能源汽车是以电能、氢能等清洁能源为动力来源的车辆，主要包含纯电动汽车、插电混动汽车等类型，是汽车产业转型的核心方向。</p >
        </div>
        <div class="card">
            <h2>新能源汽车优势</h2>
            <ul>
                <li>低碳环保，减少尾气碳排放，助力“双碳”目标</li>
                <li>能源利用效率更高，日常使用成本更低</li>
                <li>智能化程度高，搭载自动驾驶、车机互联技术</li>
            </ul>
        </div>
        <div class="card">
            <h2>行业发展前景</h2>
            <p>全球汽车产业正在向电动化、智能化快速变革。我国大力扶持新能源产业，电池技术持续突破，配套充电基础设施不断完善，新能源汽车将成为未来交通的主流。</p >
        </div>
    </div>
    <footer>
        <p>网页设计大赛作品 | 新能源汽车科普单页</p >
    </footer>
</body>
</html>
